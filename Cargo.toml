[package]
name = "factuio"
version = "0.1.0"
edition = "2024"
description = "A terminal factory-automation game: mine, smelt, belt, assemble, research, and launch the Uplink."
readme = "README.md"

[dependencies]
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
opt-level = 3
